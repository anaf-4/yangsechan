<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>양세찬 게임</title>
<style>
  html, body { margin:0; height:100%; background:#101322; color:#f3eee4; font-family:system-ui, "Malgun Gothic", sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px; box-sizing:border-box; }
  .logo { width:140px; height:140px; border-radius:30px; box-shadow:0 18px 40px rgba(0,0,0,.5); animation:flip 1.6s ease-in-out infinite; }
  @keyframes flip { 0%, 100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
  h1 { margin:0; font-size:28px; }
  p { margin:0; color:#9aa1bf; line-height:1.6; }
  button { display:none; margin-top:6px; min-height:48px; padding:0 28px; border:none; border-radius:14px; background:#ffc23d; color:#1b1406; font-size:17px; font-weight:800; box-shadow:0 5px 0 #b3811a; }
</style>
</head>
<body>
  <img class="logo" src="icon.png" alt="">
  <h1>양세찬 게임</h1>
  <p id="msg">서버에 연결하는 중…<br>처음 접속할 땐 최대 1분 정도 걸릴 수 있어요.</p>
  <button id="retry" onclick="go()">다시 시도</button>
<script>
  // 게임 서버 주소: 앞에서부터 차례로 시도 (주 서버가 안 되면 예비 서버로)
  // [주소, 기다릴 최대 시간] — 예비 서버(Render 무료)는 잠들어 있으면 깨는 데 1분쯤 걸림
  var SERVERS = [['https://yangsechan.kr/', 8000], ['https://yangsechan.onrender.com/', 70000]];
  function probe(url, ms) {
    // (앱 안의 페이지는 출처가 달라 응답 내용은 못 읽으므로 no-cors로 "응답이 왔는지"만 확인)
    return Promise.race([
      fetch(url + 'healthz', { cache: 'no-store', mode: 'no-cors' }),
      new Promise(function (_, reject) { setTimeout(reject, ms); }),
    ]);
  }
  function tryServer(i) {
    probe(SERVERS[i][0], SERVERS[i][1])
      .then(function () { location.replace(SERVERS[i][0]); })
      .catch(function () {
        if (i + 1 < SERVERS.length) {
          document.getElementById('msg').innerHTML = '예비 서버에 연결하는 중…<br>최대 1분 정도 걸릴 수 있어요.';
          return tryServer(i + 1);
        }
        document.getElementById('msg').innerHTML = '서버에 연결하지 못했어요.<br>인터넷 연결을 확인해 주세요.';
        document.getElementById('retry').style.display = 'inline-block';
      });
  }
  function go() {
    document.getElementById('retry').style.display = 'none';
    document.getElementById('msg').innerHTML = '서버에 연결하는 중…';
    tryServer(0);
  }
  go();
</script>
</body>
</html>
