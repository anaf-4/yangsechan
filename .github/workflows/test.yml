# 서버 테스트: main에 푸시하거나 PR을 열 때마다 게임 규칙 테스트(test.js)를 돌림
# Render의 Auto-Deploy를 "After CI Checks Pass"로 두면 이 테스트가 통과해야만 배포됨
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
